name: Test

on:
  pull_request:
    branches: ["master", "develop"]

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java JDK
        uses: actions/setup-java@v5.0.0
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Decode google-services.json
        uses: ./.github/actions/decode-google-services
        with:
          encoded-content: ${{ secrets.DEBUG_GOOGLE_SERVICES_JSON_BASE64 }}
          output-path: app/google-services.json
          allow-stub: 'true'

      - name: Unit Test
        run: ./gradlew testDebugUnitTest
